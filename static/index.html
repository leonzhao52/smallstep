<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>个人 Agent</title>
  <!-- Markdown 渲染：marked 转换 + DOMPurify 净化（防 XSS）+ highlight.js 代码高亮 -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      display: flex; height: 100vh; background: #f5f5f7; color: #1d1d1f;
    }
    /* 侧栏 */
    #sidebar {
      width: 260px; background: #fff; border-right: 1px solid #e5e5ea;
      display: flex; flex-direction: column;
    }
    #new-chat {
      margin: 12px; padding: 10px; border: none; border-radius: 8px;
      background: #007aff; color: #fff; font-size: 14px; cursor: pointer;
    }
    #new-chat:hover { background: #0066d6; }
    #conv-list { flex: 1; overflow-y: auto; padding: 0 8px; }
    .conv-item {
      display: flex; align-items: center; justify-content: space-between;
      gap: 6px; padding: 8px 10px; border-radius: 8px; cursor: pointer;
      font-size: 13px; margin-bottom: 4px;
    }
    .conv-item .title {
      flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .conv-item:hover { background: #f0f0f2; }
    .conv-item.active { background: #e5f0ff; }
    .conv-actions { display: none; gap: 2px; flex-shrink: 0; }
    .conv-item:hover .conv-actions { display: flex; }
    .act-btn {
      border: none; background: transparent; cursor: pointer;
      font-size: 12px; padding: 2px 4px; border-radius: 4px; color: #6e6e73;
    }
    .act-btn:hover { background: #e5e5ea; color: #1d1d1f; }
    .act-btn.danger:hover { background: #ffeceb; color: #ff3b30; }
    /* 侧栏分区（归档 / 回收站） */
    .side-section { border-top: 1px solid #e5e5ea; padding: 8px 8px 4px; }
    .side-toggle {
      font-size: 12px; color: #6e6e73; cursor: pointer; padding: 6px 4px;
      user-select: none; border-radius: 6px;
    }
    .side-toggle:hover { background: #f0f0f2; }
    .side-list { display: none; max-height: 200px; overflow-y: auto; }
    .side-list.open { display: block; }
    .side-list .conv-item { font-size: 12px; }
    .empty-hint { font-size: 12px; color: #c7c7cc; padding: 4px 6px; }
    /* 主区 */
    #main { flex: 1; display: flex; flex-direction: column; }
    #messages { flex: 1; overflow-y: auto; padding: 24px; }
    .msg { margin-bottom: 16px; display: flex; }
    .msg.user { justify-content: flex-end; }
    .bubble {
      max-width: 70%; padding: 10px 14px; border-radius: 14px;
      font-size: 14px; line-height: 1.5; white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user .bubble { background: #007aff; color: #fff; }
    .msg.assistant .bubble { background: #fff; border: 1px solid #e5e5ea; }
    .notice {
      text-align: center; font-size: 12px; color: #ff9500; margin: 8px 0;
    }
    .notice.error { color: #ff3b30; }
    /* 工具调用动态状态条 */
    .tool-status {
      margin: 8px 0; padding: 7px 12px; border-radius: 9px;
      background: #f5f5f7; border: 1px solid #e5e5ea; font-size: 12px;
      color: #6e6e73; max-width: 70%;
    }
    .tool-status-head {
      display: flex; align-items: center; gap: 7px; cursor: pointer;
      user-select: none;
    }
    .tool-status-head:hover { color: #1d1d1f; }
    .tool-status .spinner {
      width: 12px; height: 12px; flex-shrink: 0;
      border: 2px solid #d1d1d6; border-top-color: #007aff;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    .tool-status.done .spinner {
      border: none; animation: none;
      width: auto; height: auto;
    }
    .tool-status.done .spinner::before { content: '✓'; color: #34c759; font-size: 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .tool-status-current { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tool-status-chevron { flex-shrink: 0; font-size: 10px; color: #c7c7cc; }
    .tool-status-log {
      display: none; margin-top: 7px; padding-top: 7px;
      border-top: 1px solid #e5e5ea;
      font-family: "SFMono-Regular", Consolas, monospace; font-size: 11px;
      color: #86868b; max-height: 160px; overflow-y: auto;
    }
    .tool-status.open .tool-status-log { display: block; }
    .tool-status.open .tool-status-chevron { transform: rotate(90deg); }
    .tool-status-log div { padding: 1px 0; white-space: pre-wrap; word-break: break-all; }
    /* 命令确认框 */
    .approval-box {
      margin: 12px 0; padding: 12px 14px; border-radius: 10px;
      background: #fff8e6; border: 1px solid #ffd66b;
      font-size: 13px;
    }
    .approval-box .approval-title {
      font-weight: 600; color: #ad6800; margin-bottom: 6px;
      display: flex; align-items: center; gap: 6px;
    }
    .approval-box .approval-cmd {
      font-family: "SFMono-Regular", Consolas, monospace; font-size: 12px;
      background: #fff; border: 1px solid #ffd66b; border-radius: 6px;
      padding: 8px 10px; margin: 6px 0 10px; word-break: break-all;
      white-space: pre-wrap; color: #1d1d1f;
    }
    .approval-box .approval-btns { display: flex; gap: 8px; }
    .approval-box button {
      padding: 6px 16px; border: none; border-radius: 7px;
      font-size: 13px; cursor: pointer;
    }
    .approval-box .btn-allow { background: #ff9500; color: #fff; }
    .approval-box .btn-allow:hover { background: #e08600; }
    .approval-box .btn-deny { background: #e5e5ea; color: #1d1d1f; }
    .approval-box .btn-deny:hover { background: #d1d1d6; }
    .approval-box button:disabled { opacity: 0.5; cursor: not-allowed; }
    .approval-box .approval-status { color: #6e6e73; font-size: 12px; }
    /* 设置按钮（侧栏齿轮） */
    #settings-btn {
      margin: 0 12px 12px; padding: 9px; border: 1px solid #e5e5ea; border-radius: 8px;
      background: #fff; color: #1d1d1f; font-size: 13px; cursor: pointer;
    }
    #settings-btn:hover { background: #f0f0f2; }
    /* 模态框 */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35);
      z-index: 1000; align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal-panel {
      background: #fff; border-radius: 14px; width: min(680px, 92vw);
      max-height: 86vh; display: flex; flex-direction: column;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px; border-bottom: 1px solid #e5e5ea;
    }
    .modal-header h2 { font-size: 16px; font-weight: 600; }
    .modal-close { border: none; background: transparent; font-size: 20px; cursor: pointer; color: #6e6e73; }
    .modal-body { padding: 16px 20px; overflow-y: auto; flex: 1; }
    .modal-footer {
      padding: 12px 20px; border-top: 1px solid #e5e5ea;
      display: flex; justify-content: flex-end; gap: 8px;
    }
    .cfg-section { margin-bottom: 20px; }
    .cfg-section h3 { font-size: 13px; color: #6e6e73; margin-bottom: 8px; font-weight: 600; }
    .cfg-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
    .cfg-input {
      flex: 1; min-width: 120px; padding: 7px 10px; border: 1px solid #d1d1d6;
      border-radius: 7px; font-size: 13px; outline: none; font-family: inherit;
    }
    .cfg-input:focus { border-color: #007aff; }
    .cfg-input.mono { font-family: "SFMono-Regular", Consolas, monospace; font-size: 12px; }
    .cfg-small-btn {
      border: 1px solid #e5e5ea; background: #fff; border-radius: 6px;
      padding: 6px 9px; font-size: 12px; cursor: pointer; color: #6e6e73;
    }
    .cfg-small-btn:hover { background: #f0f0f2; color: #1d1d1f; }
    .cfg-small-btn.danger:hover { background: #ffeceb; color: #ff3b30; border-color: #ffccc7; }
    .cfg-hint { font-size: 11px; color: #c7c7cc; margin-top: 4px; }
    .btn-primary {
      padding: 8px 18px; border: none; border-radius: 8px; background: #007aff;
      color: #fff; font-size: 13px; cursor: pointer;
    }
    .btn-primary:hover { background: #0066d6; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    /* Toast 提示 */
    #toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #1d1d1f; color: #fff; padding: 10px 18px; border-radius: 10px;
      font-size: 13px; z-index: 2000; opacity: 0; transition: opacity 0.25s;
      pointer-events: none; max-width: 80vw;
    }
    #toast.show { opacity: 1; }
    #toast.error { background: #ff3b30; }
    /* 输入区 */
    #input-area {
      display: flex; flex-direction: column; gap: 8px; padding: 16px;
      background: #fff; border-top: 1px solid #e5e5ea;
    }
    .input-row { display: flex; gap: 8px; align-items: flex-end; }
    #input {
      flex: 1; padding: 10px 14px; border: 1px solid #d1d1d6;
      border-radius: 10px; font-size: 14px; outline: none; resize: none;
      font-family: inherit; max-height: 120px;
    }
    #input:focus { border-color: #007aff; }
    #attach-btn {
      padding: 0 14px; height: 42px; border: 1px solid #d1d1d6;
      border-radius: 10px; background: #fff; font-size: 18px; cursor: pointer;
    }
    #attach-btn:hover { border-color: #007aff; }
    #send {
      padding: 0 20px; height: 42px; border: none; border-radius: 10px;
      background: #007aff; color: #fff; font-size: 14px; cursor: pointer;
    }
    #send:disabled { background: #c7c7cc; cursor: not-allowed; }
    /* 待发送附件条 */
    #attach-strip { display: flex; flex-wrap: wrap; gap: 6px; }
    .attach-chip {
      display: inline-flex; align-items: center; gap: 6px;
      background: #f2f2f7; border-radius: 14px; padding: 4px 10px;
      font-size: 12px; color: #333;
    }
    .attach-chip .rm { cursor: pointer; color: #999; }
    .attach-chip .rm:hover { color: #ff3b30; }
    .attach-chip.uploading { color: #999; }
    /* 用户气泡内的附件标记 */
    .user-atts { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; opacity: 0.9; }
    /* Markdown 渲染样式 */
    .bubble.md { white-space: normal; }
    .bubble.md > :first-child { margin-top: 0; }
    .bubble.md > :last-child { margin-bottom: 0; }
    .bubble.md p { margin: 0.5em 0; }
    .bubble.md h1, .bubble.md h2, .bubble.md h3,
    .bubble.md h4, .bubble.md h5, .bubble.md h6 {
      margin: 0.8em 0 0.4em; line-height: 1.3; font-weight: 600;
    }
    .bubble.md h1 { font-size: 1.4em; }
    .bubble.md h2 { font-size: 1.25em; }
    .bubble.md h3 { font-size: 1.1em; }
    .bubble.md ul, .bubble.md ol { margin: 0.5em 0; padding-left: 1.5em; }
    .bubble.md li { margin: 0.25em 0; }
    .bubble.md code {
      background: rgba(0, 0, 0, 0.06); padding: 0.15em 0.4em;
      border-radius: 4px; font-size: 0.9em;
      font-family: "SFMono-Regular", Consolas, "Courier New", monospace;
    }
    .bubble.md pre {
      background: #f6f8fa; border: 1px solid #e5e5ea; border-radius: 8px;
      padding: 12px; overflow-x: auto; margin: 0.6em 0;
    }
    .bubble.md pre code {
      background: none; padding: 0; font-size: 0.88em; line-height: 1.5;
    }
    .bubble.md a { color: #007aff; }
    .bubble.md blockquote {
      border-left: 3px solid #d1d1d6; padding-left: 0.8em;
      margin: 0.5em 0; color: #6e6e73;
    }
    .bubble.md table { border-collapse: collapse; margin: 0.6em 0; }
    .bubble.md th, .bubble.md td {
      border: 1px solid #d1d1d6; padding: 6px 10px; font-size: 0.92em;
    }
    /* 代码块复制按钮 */
    .code-wrap { position: relative; }
    .copy-btn {
      position: absolute; top: 6px; right: 6px; padding: 3px 8px;
      font-size: 11px; border: 1px solid #d1d1d6; border-radius: 5px;
      background: #fff; color: #6e6e73; cursor: pointer; opacity: 0;
      transition: opacity 0.15s;
    }
    .code-wrap:hover .copy-btn { opacity: 1; }
    .copy-btn:hover { background: #f0f0f2; }
  </style>
</head>
<body>
  <div id="sidebar">
    <button id="new-chat">+ 新会话</button>
    <div id="conv-list"></div>
    <div id="archived-section" class="side-section">
      <div id="archived-toggle" class="side-toggle">已归档 ▸</div>
      <div id="archived-list" class="side-list"></div>
    </div>
    <div id="trash-section" class="side-section">
      <div id="trash-toggle" class="side-toggle">回收站 ▸</div>
      <div id="trash-list" class="side-list"></div>
    </div>
    <button id="settings-btn">⚙️ 设置</button>
  </div>
  <div id="main">
    <div id="messages"></div>
    <div id="input-area">
      <div id="attach-strip" style="display:none;"></div>
      <div class="input-row">
        <button id="attach-btn" title="添加附件">📎</button>
        <input type="file" id="file-input" multiple hidden />
        <textarea id="input" rows="1" placeholder="输入消息，Enter 发送"></textarea>
        <button id="send">发送</button>
      </div>
    </div>
  </div>

  <!-- 设置模态框 -->
  <div id="settings-modal" class="modal-overlay">
    <div class="modal-panel">
      <div class="modal-header">
        <h2>⚙️ 设置</h2>
        <button class="modal-close" id="settings-close">×</button>
      </div>
      <div class="modal-body" id="settings-body"></div>
      <div class="modal-footer">
        <button class="cfg-small-btn" id="settings-cancel">取消</button>
        <button class="btn-primary" id="settings-save">保存并热更新</button>
      </div>
    </div>
  </div>
  <div id="toast"></div>

  <script>
    const $ = (id) => document.getElementById(id);
    const messagesEl = $('messages');
    const convListEl = $('conv-list');
    const archivedListEl = $('archived-list');
    const archivedToggleEl = $('archived-toggle');
    const trashListEl = $('trash-list');
    const trashToggleEl = $('trash-toggle');
    const inputEl = $('input');
    const sendBtn = $('send');

    let currentConvId = null;
    let busy = false;
    let pendingAttachments = []; // 已上传待发送的附件元数据 [{id,name,type,size,mime}]

    // ---------- 会话列表 ----------
    // 创建一个会话条目；actions 指定要显示的操作按钮
    function createConvItem(c, actions) {
      const div = document.createElement('div');
      div.className = 'conv-item' + (c.id === currentConvId ? ' active' : '');

      const title = document.createElement('span');
      title.className = 'title';
      title.textContent = c.title || '新会话';
      title.onclick = () => selectConversation(c.id);
      div.appendChild(title);

      const acts = document.createElement('span');
      acts.className = 'conv-actions';
      const btnDefs = {
        rename:   { text: '✏️', tip: '重命名', cls: '', act: () => renameConversation(c.id, c.title) },
        archive:  { text: '📦', tip: '归档',   cls: '', act: () => setConvStatus(c.id, 'archive') },
        trash:    { text: '🗑️', tip: '删除到回收站', cls: 'danger', act: () => setConvStatus(c.id, 'trash') },
        restore:  { text: '↩️', tip: '恢复',   cls: '', act: () => setConvStatus(c.id, 'restore') },
        delete:   { text: '❌', tip: '永久删除', cls: 'danger', act: () => deleteForever(c.id) },
      };
      actions.forEach((key) => {
        const d = btnDefs[key];
        const b = document.createElement('button');
        b.className = 'act-btn ' + d.cls;
        b.textContent = d.text;
        b.title = d.tip;
        b.onclick = (e) => { e.stopPropagation(); d.act(); };
        acts.appendChild(b);
      });
      div.appendChild(acts);
      return div;
    }

    async function loadConversations() {
      // 主列表：active
      const res = await fetch('/api/conversations?status=active');
      const convs = await res.json();
      convListEl.innerHTML = '';
      if (convs.length === 0) {
        const hint = document.createElement('div');
        hint.className = 'empty-hint';
        hint.textContent = '暂无会话';
        convListEl.appendChild(hint);
      }
      convs.forEach((c) => convListEl.appendChild(createConvItem(c, ['rename', 'archive', 'trash'])));

      // 归档区
      const resA = await fetch('/api/conversations?status=archived');
      const archived = await resA.json();
      archivedListEl.innerHTML = '';
      if (archived.length === 0) {
        const hint = document.createElement('div');
        hint.className = 'empty-hint';
        hint.textContent = '没有归档会话';
        archivedListEl.appendChild(hint);
      }
      archived.forEach((c) => archivedListEl.appendChild(createConvItem(c, ['rename', 'restore', 'trash'])));

      // 回收站区
      const resT = await fetch('/api/conversations?status=trashed');
      const trashed = await resT.json();
      trashListEl.innerHTML = '';
      if (trashed.length === 0) {
        const hint = document.createElement('div');
        hint.className = 'empty-hint';
        hint.textContent = '回收站为空';
        trashListEl.appendChild(hint);
      }
      trashed.forEach((c) => trashListEl.appendChild(createConvItem(c, ['restore', 'delete'])));
    }

    async function renameConversation(id, oldTitle) {
      const title = prompt('重命名会话', oldTitle || '');
      if (title === null) return;
      const t = title.trim();
      if (!t) return;
      await fetch(`/api/conversations/${id}/rename`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: t }),
      });
      loadConversations();
      if (id === currentConvId) loadConversations();
    }

    async function setConvStatus(id, action) {
      await fetch(`/api/conversations/${id}/${action}`, { method: 'POST' });
      // 如果当前选中的会话被移走（归档/删除），清空主区
      if (id === currentConvId && (action === 'archive' || action === 'trash')) {
        currentConvId = null;
        messagesEl.innerHTML = '';
      }
      loadConversations();
    }

    async function deleteForever(id) {
      if (!confirm('永久删除该会话？此操作不可恢复。')) return;
      await fetch(`/api/conversations/${id}`, { method: 'DELETE' });
      if (id === currentConvId) {
        currentConvId = null;
        messagesEl.innerHTML = '';
      }
      loadConversations();
    }

    async function selectConversation(id) {
      currentConvId = id;
      messagesEl.innerHTML = '';
      const res = await fetch(`/api/conversations/${id}`);
      if (!res.ok) return;
      const conv = await res.json();
      (conv.messages || []).forEach((m) => {
        const b = addBubble(m.role, m.content, m.role === 'assistant'); // 模型消息渲染 Markdown
        // 用户消息若带附件，显示附件标记（历史里的 content 已内联文本/图片）
        if (m.role === 'user' && m.attachments) addAttachmentBadges(b, m.attachments);
      });
      loadConversations();
      scrollToBottom();
    }

    async function newConversation() {
      const res = await fetch('/api/conversations', { method: 'POST' });
      const conv = await res.json();
      currentConvId = conv.id;
      messagesEl.innerHTML = '';
      loadConversations();
      inputEl.focus();
    }

    // ---------- Markdown 渲染 ----------
    // marked：把 Markdown 转 HTML，代码块用 highlight.js 高亮
    marked.setOptions({
      gfm: true,        // GitHub 风格 Markdown（支持表格、删除线等）
      breaks: true,     // 单个换行也当 <br>
      highlight: function (code, lang) {
        if (lang && hljs.getLanguage(lang)) {
          try { return hljs.highlight(code, { language: lang }).value; } catch {}
        }
        return hljs.highlightAuto(code).value;
      },
    });

    // 渲染 Markdown 并净化（防 XSS：过滤 script/事件属性等危险内容）
    function renderMarkdown(text) {
      const rawHtml = marked.parse(text || '');
      return DOMPurify.sanitize(rawHtml);
    }

    // 给每个代码块包一层，加"复制"按钮
    function enhanceCodeBlocks(container) {
      container.querySelectorAll('pre').forEach((pre) => {
        if (pre.parentElement.classList.contains('code-wrap')) return; // 已处理
        const wrap = document.createElement('div');
        wrap.className = 'code-wrap';
        pre.replaceWith(wrap);
        wrap.appendChild(pre);

        const btn = document.createElement('button');
        btn.className = 'copy-btn';
        btn.textContent = '复制';
        btn.onclick = () => {
          const code = pre.querySelector('code');
          navigator.clipboard.writeText(code ? code.textContent : pre.textContent);
          btn.textContent = '已复制';
          setTimeout(() => { btn.textContent = '复制'; }, 1500);
        };
        wrap.appendChild(btn);
      });
    }

    // 把一段 Markdown 文本渲染进某个气泡
    function setBubbleMarkdown(bubble, text) {
      bubble.classList.add('md');
      bubble.innerHTML = renderMarkdown(text);
      enhanceCodeBlocks(bubble);
    }

    // ---------- 消息渲染 ----------
    function addBubble(role, content, useMarkdown = false) {
      const wrap = document.createElement('div');
      wrap.className = `msg ${role}`;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      if (useMarkdown) {
        setBubbleMarkdown(bubble, content || '');
      } else {
        bubble.textContent = content || '';
      }
      wrap.appendChild(bubble);
      messagesEl.appendChild(wrap);
      scrollToBottom();
      return bubble;
    }

    function addNotice(text, isError = false) {
      const div = document.createElement('div');
      div.className = 'notice' + (isError ? ' error' : '');
      div.textContent = text;
      messagesEl.appendChild(div);
      scrollToBottom();
    }

    // 渲染命令确认框，返回确认框 DOM（按钮点击后调确认端点）
    function addApprovalRequest(reqId, command) {
      const box = document.createElement('div');
      box.className = 'approval-box';
      box.innerHTML = `
        <div class="approval-title">⚠️ 需要你的确认</div>
        <div>Agent 想执行以下命令（可能产生副作用）：</div>
        <div class="approval-cmd"></div>
        <div class="approval-btns">
          <button class="btn-allow">允许执行</button>
          <button class="btn-deny">拒绝</button>
        </div>
      `;
      box.querySelector('.approval-cmd').textContent = command; // textContent 防 XSS
      const allowBtn = box.querySelector('.btn-allow');
      const denyBtn = box.querySelector('.btn-deny');

      const decide = async (approved) => {
        allowBtn.disabled = true;
        denyBtn.disabled = true;
        try {
          await fetch(`/api/command-confirm/${reqId}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ approved }),
          });
          const status = document.createElement('div');
          status.className = 'approval-status';
          status.textContent = approved ? '✓ 已允许，执行中…' : '✗ 已拒绝';
          box.querySelector('.approval-btns').replaceWith(status);
        } catch (e) {
          addNotice(`确认失败：${e.message}`, true);
        }
      };
      allowBtn.onclick = () => decide(true);
      denyBtn.onclick = () => decide(false);

      messagesEl.appendChild(box);
      scrollToBottom();
    }

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // ---------- 发送 + 流式 ----------
    async function send() {
      const text = inputEl.value.trim();
      // 有附件时允许纯附件发送（无文字）；两者都没有才拦截
      if ((!text && pendingAttachments.length === 0) || busy || !currentConvId) return;
      // 等待仍在上传中的附件完成
      if (pendingAttachments.some((a) => a.uploading)) {
        addNotice('附件还在上传中，请稍候…');
        return;
      }

      busy = true;
      sendBtn.disabled = true;
      toolStatusEl = null;   // 新一轮：重置工具状态条（旧的已在上一轮 toolStatusFinish 里折叠保留）
      toolStatusLog = null;
      inputEl.value = '';
      const atts = pendingAttachments.slice();
      pendingAttachments = [];
      renderAttachStrip();

      const userBubble = addBubble('user', text); // 用户消息保持纯文本
      addAttachmentBadges(userBubble, atts);

      const assistantBubble = addBubble('assistant', '', true); // 模型回复走 Markdown
      let assistantText = '';

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ conversation_id: currentConvId, message: text, attachments: atts }),
        });

        if (!res.ok || !res.body) {
          throw new Error(`请求失败: ${res.status}`);
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });

          // SSE 事件以空行分隔
          const parts = buffer.split('\n\n');
          buffer = parts.pop(); // 最后一段可能不完整，留到下一轮

          for (const part of parts) {
            const line = part.trim();
            if (!line.startsWith('data:')) continue;
            const dataStr = line.slice(5).trim();
            if (!dataStr) continue;
            let event;
            try { event = JSON.parse(dataStr); } catch { continue; }
            handleEvent(event, assistantBubble, () => assistantText, (t) => { assistantText = t; });
          }
        }
      } catch (err) {
        addNotice(`出错了：${err.message}`, true);
      } finally {
        busy = false;
        sendBtn.disabled = false;
        inputEl.focus();
        loadConversations();
      }
    }

    // ---------- 工具调用动态状态条 ----------
    // 每条 assistant 回复最多一个状态条：运行时显示当前步骤 + 转圈，
    // 可点开看完整步骤日志；工具全部结束后折叠并标记完成。
    let toolStatusEl = null;   // 当前的状态条 DOM
    let toolStatusLog = null;  // 状态条里的步骤日志容器
    let toolStepCount = 0;

    function toolStatusEnsure() {
      if (toolStatusEl) return;
      toolStatusEl = document.createElement('div');
      toolStatusEl.className = 'tool-status';
      toolStatusEl.innerHTML = `
        <div class="tool-status-head">
          <span class="spinner"></span>
          <span class="tool-status-current">调用工具…</span>
          <span class="tool-status-chevron">▶</span>
        </div>
        <div class="tool-status-log"></div>
      `;
      // 点头部折叠/展开日志
      toolStatusEl.querySelector('.tool-status-head').onclick = () => {
        toolStatusEl.classList.toggle('open');
      };
      messagesEl.appendChild(toolStatusEl);
      toolStatusLog = toolStatusEl.querySelector('.tool-status-log');
      toolStepCount = 0;
      scrollToBottom();
    }

    function toolStatusUpdate(name) {
      toolStatusEnsure();
      toolStepCount++;
      const line = document.createElement('div');
      line.textContent = `${toolStepCount}. 调用 ${name}`;
      toolStatusLog.appendChild(line);
      toolStatusEl.querySelector('.tool-status-current').textContent =
        `正在调用 ${name}（第 ${toolStepCount} 步）…`;
      toolStatusLog.scrollTop = toolStatusLog.scrollHeight;
      scrollToBottom();
    }

    function toolStatusResult(name) {
      if (!toolStatusEl) return;
      const line = document.createElement('div');
      line.textContent = `   ↳ ${name} 已返回`;
      toolStatusLog.appendChild(line);
      toolStatusLog.scrollTop = toolStatusLog.scrollHeight;
      scrollToBottom();
    }

    // 工具阶段结束（收到正文/完成），折叠状态条并标记完成
    function toolStatusFinish() {
      if (!toolStatusEl) return;
      toolStatusEl.classList.remove('open');
      toolStatusEl.classList.add('done');
      const cur = toolStatusEl.querySelector('.tool-status-current');
      cur.textContent = `已完成 ${toolStepCount} 次工具调用`;
      toolStatusEl = null;
      toolStatusLog = null;
    }

    function handleEvent(event, bubble, getText, setText) {
      // approval_request 等事件是 {"event": {...}} 包裹结构，统一取内层 payload。
      // 平铺事件（text_delta 等）没有 event 键，保持原样。
      if (event && typeof event.event === 'object' && event.event !== null) {
        event = event.event;
      }
      switch (event.type) {
        case 'text_delta':
          // 收到正文说明工具阶段结束，折叠状态条
          toolStatusFinish();
          setText(getText() + event.content);
          setBubbleMarkdown(bubble, getText()); // 流式期间实时渲染 Markdown
          scrollToBottom();
          break;
        case 'model_fallback':
          addNotice(`模型 ${event.failed} 不可用，已切换…`);
          break;
        case 'tool_call':
          toolStatusUpdate(event.name);
          break;
        case 'tool_result':
          toolStatusResult(event.name);
          break;
        case 'error':
          toolStatusFinish();
          addNotice(event.message, true);
          break;
        case 'title_update':
          loadConversations(); // 标题生成完成，刷新侧栏列表
          break;
        case 'approval_request':
          // 高风险命令需要用户确认
          addApprovalRequest(event.request_id, event.command);
          break;
        case 'done':
          toolStatusFinish();
          break;
      }
    }

    // ---------- 附件上传 ----------
    const attachBtn = $('attach-btn');
    const fileInput = $('file-input');
    const attachStrip = $('attach-strip');

    function renderAttachStrip() {
      attachStrip.innerHTML = '';
      if (pendingAttachments.length === 0) {
        attachStrip.style.display = 'none';
        return;
      }
      attachStrip.style.display = 'flex';
      pendingAttachments.forEach((att, idx) => {
        const chip = document.createElement('span');
        chip.className = 'attach-chip' + (att.uploading ? ' uploading' : '');
        const icon = att.type === 'image' ? '🖼️' : '📎';
        const label = document.createElement('span');
        label.textContent = `${icon} ${att.uploading ? '上传中… ' : ''}${att.name}`;
        chip.appendChild(label);
        if (!att.uploading) {
          const rm = document.createElement('span');
          rm.className = 'rm';
          rm.textContent = '✕';
          rm.title = '移除';
          rm.onclick = () => { pendingAttachments.splice(idx, 1); renderAttachStrip(); };
          chip.appendChild(rm);
        }
        attachStrip.appendChild(chip);
      });
    }

    async function uploadFile(file) {
      // 占位：上传中
      const temp = { name: file.name, type: null, uploading: true };
      pendingAttachments.push(temp);
      renderAttachStrip();
      try {
        const fd = new FormData();
        fd.append('file', file);
        fd.append('conversation_id', currentConvId || '');
        const res = await fetch('/api/upload', { method: 'POST', body: fd });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || `上传失败: ${res.status}`);
        }
        const meta = await res.json();
        // 用真实元数据替换占位
        const i = pendingAttachments.indexOf(temp);
        if (i !== -1) pendingAttachments[i] = meta;
        renderAttachStrip();
      } catch (err) {
        pendingAttachments.splice(pendingAttachments.indexOf(temp), 1);
        renderAttachStrip();
        addNotice(`附件上传失败：${err.message}`, true);
      }
    }

    attachBtn.onclick = () => fileInput.click();
    fileInput.onchange = () => {
      for (const f of fileInput.files) uploadFile(f);
      fileInput.value = ''; // 允许重复选同一文件
    };

    // 用户气泡里显示附件标记
    function addAttachmentBadges(bubble, atts) {
      if (!atts || !atts.length) return;
      const div = document.createElement('div');
      div.className = 'user-atts';
      atts.forEach((a) => {
        const s = document.createElement('span');
        s.textContent = `${a.type === 'image' ? '🖼️' : '📎'} ${a.name}`;
        div.appendChild(s);
      });
      bubble.appendChild(div);
    }

    // ---------- 配置管理（设置面板） ----------
    const settingsModalEl = $('settings-modal');
    const settingsBodyEl = $('settings-body');
    let cfgDraft = null; // 面板打开期间的本地草稿 {providers, model_priority, channels, env_keys}

    // 中央 fetch 封装：JSON 头 + 统一错误上抛
    async function api(url, opts = {}) {
      const init = { headers: {}, ...opts };
      if (opts.body !== undefined) {
        init.headers['Content-Type'] = 'application/json';
        init.body = JSON.stringify(opts.body);
      }
      const res = await fetch(url, init);
      let data = null;
      try { data = await res.json(); } catch {}
      if (!res.ok) {
        throw new Error((data && data.detail) || `请求失败 (${res.status})`);
      }
      return data;
    }

    // Toast 提示
    function toast(msg, isError = false) {
      const el = $('toast');
      el.textContent = msg;
      el.className = 'show' + (isError ? ' error' : '');
      setTimeout(() => { el.className = ''; }, 2600);
    }

    async function openSettings() {
      try {
        cfgDraft = await api('/api/config');
      } catch (e) {
        addNotice(`加载配置失败：${e.message}`, true);
        return;
      }
      renderSettings();
      settingsModalEl.classList.add('open');
    }

    function closeSettings() {
      settingsModalEl.classList.remove('open');
      cfgDraft = null;
    }

    function renderSettings() {
      settingsBodyEl.innerHTML = '';

      // ── 模型优先级 ──
      const secModel = document.createElement('div');
      secModel.className = 'cfg-section';
      secModel.innerHTML = `
        <h3>模型优先级（从上到下依次回退）</h3>
        <div class="cfg-model-list"></div>
        <button class="cfg-small-btn cfg-add-model">＋ 添加模型</button>
        <div class="cfg-hint">provider 需在下方已定义；第一个失败会自动回退到下一个。</div>
      `;
      const modelList = secModel.querySelector('.cfg-model-list');
      const renderModels = () => {
        modelList.innerHTML = '';
        cfgDraft.model_priority.forEach((c, i) => {
          const row = document.createElement('div');
          row.className = 'cfg-row';
          const sel = document.createElement('select');
          sel.className = 'cfg-input';
          // cfgDraft.providers 是数组 [{name, base_url, ...}]，取 name 作为选项
          cfgDraft.providers.forEach((p) => {
            if (!p.name) return; // 跳过名称为空的新增行
            const opt = document.createElement('option');
            opt.value = p.name; opt.textContent = p.name;
            if (p.name === c.provider) opt.selected = true;
            sel.appendChild(opt);
          });
          const mdl = document.createElement('input');
          mdl.className = 'cfg-input mono'; mdl.value = c.model;
          mdl.placeholder = 'model 名';
          mdl.oninput = () => { cfgDraft.model_priority[i].model = mdl.value; };
          sel.onchange = () => { cfgDraft.model_priority[i].provider = sel.value; };
          row.appendChild(sel); row.appendChild(mdl);
          row.appendChild(upDownBtns(cfgDraft.model_priority, i, renderModels));
          const del = document.createElement('button');
          del.className = 'cfg-small-btn danger'; del.textContent = '✕';
          del.onclick = () => { cfgDraft.model_priority.splice(i, 1); renderModels(); };
          row.appendChild(del);
          modelList.appendChild(row);
        });
      };
      renderModels();
      secModel.querySelector('.cfg-add-model').onclick = () => {
        const firstProvider = Object.keys(cfgDraft.providers)[0] || '';
        cfgDraft.model_priority.push({ provider: firstProvider, model: '' });
        renderModels();
      };
      settingsBodyEl.appendChild(secModel);

      // ── Provider 连接 ──
      const secProv = document.createElement('div');
      secProv.className = 'cfg-section';
      secProv.innerHTML = `
        <h3>Provider 连接</h3>
        <div class="cfg-prov-list"></div>
        <button class="cfg-small-btn cfg-add-prov">＋ 添加 Provider</button>
      `;
      const provList = secProv.querySelector('.cfg-prov-list');
      const renderProviders = () => {
        provList.innerHTML = '';
        cfgDraft.providers.forEach((p, i) => {
          const row = document.createElement('div');
          row.className = 'cfg-row';
          const name = document.createElement('input');
          name.className = 'cfg-input mono'; name.value = p.name; name.placeholder = '名称';
          name.style.maxWidth = '110px';
          name.oninput = () => { p.name = name.value; };
          const url = document.createElement('input');
          url.className = 'cfg-input mono'; url.value = p.base_url; url.placeholder = 'base_url';
          url.oninput = () => { p.base_url = url.value; };
          const del = document.createElement('button');
          del.className = 'cfg-small-btn danger'; del.textContent = '✕';
          del.onclick = () => { cfgDraft.providers.splice(i, 1); renderProviders(); renderModels(); };
          row.appendChild(name); row.appendChild(url); row.appendChild(del);
          provList.appendChild(row);
        });
      };
      renderProviders();
      secProv.querySelector('.cfg-add-prov').onclick = () => {
        cfgDraft.providers.push({ name: '', base_url: '', api_key_ref: '' });
        renderProviders();
      };
      settingsBodyEl.appendChild(secProv);

      // ── API 密钥（脱敏，留空表示不改） ──
      const secKeys = document.createElement('div');
      secKeys.className = 'cfg-section';
      secKeys.innerHTML = `<h3>API 密钥（留空表示不修改）</h3><div class="cfg-keys-list"></div>`;
      const keysList = secKeys.querySelector('.cfg-keys-list');
      Object.entries(cfgDraft.env_keys || {}).forEach(([k, masked]) => {
        const row = document.createElement('div');
        row.className = 'cfg-row';
        const label = document.createElement('span');
        label.className = 'cfg-input mono';
        label.style.flex = '0 0 150px'; label.style.background = '#f5f5f7';
        label.textContent = k;
        const input = document.createElement('input');
        input.className = 'cfg-input mono'; input.type = 'password';
        input.placeholder = masked ? `已设置 (${masked.slice(0, 3)}…) 留空不改` : '未设置，填入新值';
        input.dataset.envkey = k;
        row.appendChild(label); row.appendChild(input);
        keysList.appendChild(row);
      });
      settingsBodyEl.appendChild(secKeys);

      // ── 接入渠道（预留） ──
      const secCh = document.createElement('div');
      secCh.className = 'cfg-section';
      secCh.innerHTML = `
        <h3>接入渠道</h3>
        <div class="cfg-ch-list"></div>
        <div class="cfg-hint">wechat 为后续个人微信接入预留的结构，当前仅 webui 生效。</div>
      `;
      const chList = secCh.querySelector('.cfg-ch-list');
      Object.entries(cfgDraft.channels || {}).forEach(([name, ch]) => {
        const row = document.createElement('div');
        row.className = 'cfg-row';
        const cb = document.createElement('input');
        cb.type = 'checkbox'; cb.checked = ch.enabled; cb.id = 'ch-' + name;
        const lbl = document.createElement('label');
        lbl.htmlFor = cb.id; lbl.textContent = name;
        lbl.style.fontSize = '13px'; lbl.style.minWidth = '70px';
        const users = document.createElement('input');
        users.className = 'cfg-input'; users.placeholder = '允许的用户（逗号分隔）';
        users.value = (ch.allowed_users || []).join(', ');
        users.oninput = () => {
          ch.allowed_users = users.value.split(',').map((s) => s.trim()).filter(Boolean);
        };
        cb.onchange = () => { ch.enabled = cb.checked; };
        row.appendChild(cb); row.appendChild(lbl); row.appendChild(users);
        chList.appendChild(row);
      });
      settingsBodyEl.appendChild(secCh);
    }

    // 上移/下移按钮组（用于模型优先级排序）
    function upDownBtns(arr, i, rerender) {
      const wrap = document.createElement('span');
      const up = document.createElement('button');
      up.className = 'cfg-small-btn'; up.textContent = '↑'; up.disabled = i === 0;
      up.onclick = () => { [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]]; rerender(); };
      const down = document.createElement('button');
      down.className = 'cfg-small-btn'; down.textContent = '↓';
      down.disabled = i === arr.length - 1;
      down.onclick = () => { [arr[i + 1], arr[i]] = [arr[i], arr[i + 1]]; rerender(); };
      wrap.appendChild(up); wrap.appendChild(down);
      return wrap;
    }

    async function saveSettings() {
      const saveBtn = $('settings-save');
      // 收集密钥：只发送用户填了新值的项
      const keys = {};
      settingsBodyEl.querySelectorAll('input[data-envkey]').forEach((inp) => {
        if (inp.value.trim()) keys[inp.dataset.envkey] = inp.value;
      });
      saveBtn.disabled = true;
      try {
        await api('/api/config', {
          method: 'PUT',
          body: {
            providers: cfgDraft.providers,
            model_priority: cfgDraft.model_priority,
            channels: cfgDraft.channels,
            keys,
          },
        });
        toast('✓ 配置已保存并热更新');
        closeSettings();
      } catch (e) {
        toast(`保存失败：${e.message}`, true);
      } finally {
        saveBtn.disabled = false;
      }
    }

    // ---------- 事件绑定 ----------
    sendBtn.onclick = send;
    $('new-chat').onclick = newConversation;
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });
    // 自适应高度
    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
    });

    // 侧栏分区折叠
    archivedToggleEl.onclick = () => {
      const open = archivedListEl.classList.toggle('open');
      archivedToggleEl.textContent = open ? '已归档 ▾' : '已归档 ▸';
    };
    trashToggleEl.onclick = () => {
      const open = trashListEl.classList.toggle('open');
      trashToggleEl.textContent = open ? '回收站 ▾' : '回收站 ▸';
    };

    // 设置面板
    $('settings-btn').onclick = openSettings;
    $('settings-close').onclick = closeSettings;
    $('settings-cancel').onclick = closeSettings;
    $('settings-save').onclick = saveSettings;
    settingsModalEl.onclick = (e) => {
      if (e.target === settingsModalEl) closeSettings(); // 点遮罩关闭
    };

    // 初始化
    (async () => {
      await loadConversations();
      // 没有会话时自动建一个
      const res = await fetch('/api/conversations?status=active');
      const convs = await res.json();
      if (convs.length === 0) {
        await newConversation();
      }
    })();
  </script>
</body>
</html>
